name: Garden Lab CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'garden-lab/**'
      - '.github/workflows/garden-lab-ci.yml'

permissions:
  contents: read

concurrency:
  group: garden-lab-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  garden-lab:
    name: Geometry, build and WebGL browser checks
    # Playwright 1.56.1 has browser dependencies for Ubuntu 24.04. Keep its
    # runner stable when ubuntu-latest advances to a newer distribution.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: garden-lab
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Geometry and state tests
        run: npm test
      - name: Build the static site
        run: npm run build
      - name: Install ephemeral browser test dependency
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Install Chromium and system dependencies
        run: python3 scripts/install-ci-browser.py
      - name: Terrace, balcony and two-car browser checks
        timeout-minutes: 8
        run: node scripts/refinements-browser-check.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: garden-lab-browser-evidence
          path: garden-lab/test-results/
          if-no-files-found: ignore
          retention-days: 7

  gpu-phase-profile:
    name: GPU phase diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    defaults:
      run:
        working-directory: garden-lab
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read the unchanged walking fixture
        uses: actions/checkout@v6
        with:
          ref: 66c096a94b6ada93e015a98bce07b4b3a643f933
          path: .walk-baseline
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run build
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: python3 scripts/install-ci-browser.py
      - name: Measure scene and final-image work without changing acceptance gates
        # Three independent 120 s caps, plus reporting and teardown.
        timeout-minutes: 7
        env:
          BASELINE_DIR: ../.walk-baseline/garden-lab
        run: node scripts/gpu-phase-profile.mjs
      - name: Upload bounded phase measurements
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gpu-phase-profile-evidence
          path: garden-lab/test-results/gpu-phase-profile/
          if-no-files-found: ignore
          retention-days: 7

  browser-regression:
    name: WebGL regression · ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        scenario: [garage, sternicza, nadmorska]
    defaults:
      run:
        working-directory: garden-lab
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run build
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: python3 scripts/install-ci-browser.py
      - name: Functional WebGL regression and screenshots
        timeout-minutes: 12
        env:
          GARDEN_SCENARIO_GROUP: ${{ matrix.scenario }}
        run: node scripts/night-browser-check.mjs
      - name: Upload scenario evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: garden-lab-browser-${{ matrix.scenario }}
          path: garden-lab/test-results/night/${{ matrix.scenario }}/
          if-no-files-found: ignore
          retention-days: 7

  studio:
    name: Design studio · ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    # The 1.33 serial run passed its complete style and lifecycle checks before
    # reaching 30m with mobile/property cases remaining. Independent groups
    # retain every assertion and bounded action/render deadlines in parallel.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: [styles, styles-minimal, controls, properties, garden-living]
    defaults:
      run:
        working-directory: garden-lab
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run build
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: python3 scripts/install-ci-browser.py
      - run: node scripts/studio-browser-check.mjs
        env:
          STUDIO_SCENARIO_GROUP: ${{ matrix.scenario }}
      - name: Upload design studio evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: studio-evidence-${{ matrix.scenario }}
          path: garden-lab/test-results/studio/${{ matrix.scenario }}/
          if-no-files-found: ignore
          retention-days: 7

  interiors:
    name: Interior layouts, materials and mobile walkthrough
    runs-on: ubuntu-24.04
    # 34 renovations plus room, persistence and mobile checks. Detailed
    # fit-out views run in independent groups below to bound capture time.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: garden-lab
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run build
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: python3 scripts/install-ci-browser.py
      - name: Original and renovated interiors in WebGL
        timeout-minutes: 25
        run: node scripts/interiors-browser-check.mjs
      - name: Upload interior evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: interior-evidence
          path: garden-lab/test-results/interiors/
          if-no-files-found: ignore
          retention-days: 7

  living-fitouts:
    name: Living fit-outs · ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: [architecture, guests, office-basement]
    defaults:
      run:
        working-directory: garden-lab
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run build
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: python3 scripts/install-ci-browser.py
      - name: Requested fit-outs and protected openings in WebGL
        timeout-minutes: 15
        env:
          LIVING_FITOUT_GROUP: ${{ matrix.group }}
        run: node scripts/living-fitouts-browser-check.mjs
      - name: Upload fit-out evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: living-fitouts-${{ matrix.group }}
          path: garden-lab/test-results/living-fitouts-${{ matrix.group }}/
          if-no-files-found: ignore
          retention-days: 7

  clean-living:
    name: Covers and glazing · ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Each sequence retains its 600-second capture budget and every assertion.
    # Their combined run exhausted that budget after the bathroom views on
    # shared software-GPU runners, before the final sauna/cutaway captures.
    strategy:
      fail-fast: false
      matrix:
        group: [garden, interiors]
    defaults:
      run:
        working-directory: garden-lab
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run build
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: python3 scripts/install-ci-browser.py
      - name: Inspect the clean living refinement in real WebGL
        timeout-minutes: 12
        env:
          CLEAN_LIVING_GROUP: ${{ matrix.group }}
        run: node scripts/clean-living-browser-check.mjs
      - name: Upload clean living evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: clean-living-evidence-${{ matrix.group }}
          path: garden-lab/test-results/clean-living/${{ matrix.group }}/
          if-no-files-found: ignore
          retention-days: 7

  architectural-rendering:
    name: Architectural rendering comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: garden-lab
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out the previous renderer for identical-camera comparisons
        uses: actions/checkout@v6
        with:
          ref: e9447099a7b82e094440754e663d670d74adff5f
          path: .render-baseline
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run build
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: python3 scripts/install-ci-browser.py
      - name: Compare real rendered scenes and check photographic asset loading
        env:
          RENDER_BASELINE: ../.render-baseline/garden-lab
        run: node scripts/realism-browser-check.mjs
      - name: Upload architectural rendering evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: architectural-rendering-evidence
          path: garden-lab/test-results/realism/
          if-no-files-found: ignore
          retention-days: 7

  neighborhood-realism:
    name: Measured neighbourhood and sea-height browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: garden-lab
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run build
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: python3 scripts/install-ci-browser.py
      - name: Check measured trees, sea controls and mobile layout in WebGL
        timeout-minutes: 12
        run: node scripts/check-neighborhood-realism.mjs
      - name: Upload neighbourhood and sea-view evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: neighborhood-realism-evidence
          path: garden-lab/test-results/neighborhood-realism/
          if-no-files-found: ignore
          retention-days: 7

  corner-pavilion:
    name: Corner pavilion alternatives and mobile checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: garden-lab
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run build
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: python3 scripts/install-ci-browser.py
      - name: Compare pavilion placements, heights, persistence and mobile controls
        timeout-minutes: 14
        run: node scripts/pavilion-browser-check.mjs
      - name: Upload pavilion evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: corner-pavilion-evidence
          path: garden-lab/test-results/pavilion/
          if-no-files-found: ignore
          retention-days: 7

  cinema-kitchen:
    name: Cinema and kitchen · ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Keep the complete layout and room-entry evidence within independent
    # ten-minute capture budgets on software-GPU runners.
    strategy:
      fail-fast: false
      matrix:
        group: [layouts, kitchen]
    defaults:
      run:
        working-directory: garden-lab
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run build
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: python3 scripts/install-ci-browser.py
      - name: Inspect physical layouts and equipment in real WebGL
        timeout-minutes: 12
        env:
          CINEMA_KITCHEN_GROUP: ${{ matrix.group }}
        run: node scripts/cinema-kitchen-browser-check.mjs
      - name: Upload cinema and kitchen evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cinema-kitchen-evidence-${{ matrix.group }}
          path: garden-lab/test-results/cinema-kitchen/${{ matrix.group }}/
          if-no-files-found: ignore
          retention-days: 7

  walk-performance:
    name: Walking performance · ${{ matrix.route }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Each route compares all three versions in one browser on one runner.
    # Independent routes keep slow controls from cancelling later candidates.
    strategy:
      fail-fast: false
      matrix:
        route: [living, garden]
    defaults:
      run:
        working-directory: garden-lab
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out the published 1.39 baseline
        uses: actions/checkout@v6
        with:
          ref: 66c096a94b6ada93e015a98bce07b4b3a643f933
          path: .walk-baseline
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run build
      - name: Build the baseline unchanged
        run: npm run build
        working-directory: .walk-baseline/garden-lab
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: python3 scripts/install-ci-browser.py
      - name: Compare identical continuous navigation routes
        # Slow baseline frames still need a useful sample; each measured route
        # has its own bounded warmup/capture deadline and retains failure data.
        timeout-minutes: 16
        env:
          BASELINE_DIR: ../.walk-baseline/garden-lab
          WALK_PERFORMANCE_ROUTE: ${{ matrix.route }}
          BENCHMARK_GPU_DIAGNOSTICS: '1'
          ENFORCE_PERFORMANCE_REGRESSION: '1'
        run: node scripts/walk-performance-browser-check.mjs
      - name: Upload walking performance evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: walk-performance-evidence-${{ matrix.route }}
          path: garden-lab/test-results/walk-performance/${{ matrix.route }}/
          if-no-files-found: ignore
          retention-days: 7
